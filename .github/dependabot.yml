version: 2

updates:
  # main (current version)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
    cooldown:
      semver-major-days: 90 # it’s the maximum allowed by dependabot, 3 months
    groups: # Group updates by patch type in the same PR
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Ignore a dependency in Dependabot without blocking its security updates
    # @see https://pydevtools.com/handbook/how-to/how-to-ignore-a-dependency-in-dependabot-without-blocking-security-updates/#scope-the-ignore-rule-to-version-updates
    ignore:
    - dependency-name: "glob"
      update-types:
        - "version-update:semver-major"
        - "version-update:semver-minor"
        - "version-update:semver-patch"
    - dependency-name: "minimatch"
      update-types:
        - "version-update:semver-major"
        - "version-update:semver-minor"
        - "version-update:semver-patch"
    - dependency-name: "nodemailer"
      update-types:
        - "version-update:semver-major"
        - "version-update:semver-minor"
        - "version-update:semver-patch"
    - dependency-name: "zod"
      update-types:
        - "version-update:semver-major"
        - "version-update:semver-minor"
        - "version-update:semver-patch"

  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
    cooldown:
      semver-major-days: 90 # it’s the maximum allowed by dependabot, 3 months
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "main"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]

  # stable/textile (regulatory version)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "stable/textile"
    schedule:
      interval: "monthly"
    cooldown:
      semver-major-days: 90 # it’s the maximum allowed by dependabot, 3 months
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Ignore a dependency in Dependabot without blocking its security updates
    # @see https://pydevtools.com/handbook/how-to/how-to-ignore-a-dependency-in-dependabot-without-blocking-security-updates/#scope-the-ignore-rule-to-version-updates
    ignore:
    - dependency-name: "glob"
      update-types:
        - "version-update:semver-major"
        - "version-update:semver-minor"
        - "version-update:semver-patch"
    - dependency-name: "minimatch"
      update-types:
        - "version-update:semver-major"
        - "version-update:semver-minor"
        - "version-update:semver-patch"
    - dependency-name: "nodemailer"
      update-types:
        - "version-update:semver-major"
        - "version-update:semver-minor"
        - "version-update:semver-patch"
    - dependency-name: "zod"
      update-types:
        - "version-update:semver-major"
        - "version-update:semver-minor"
        - "version-update:semver-patch"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "stable/textile"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
